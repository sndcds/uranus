            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope400'
                  - type: object
                    properties:
                      data:
                        nullable: true

              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-languages
                status: 400
                timestamp: '2026-09-20T10:17:15Z'
                metadata:
                  language: en
                  response_time_ms: 3
                data: null
                message: Invalid JSON input

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableLanguagesResponseEnvelope500'
                  - type: object
                    properties:
                      data:
                        nullable: true

              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-languages
