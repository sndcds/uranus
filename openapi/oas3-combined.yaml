  /api/choosable-countries:
    get:
      operationId: getChoosableCountries
      summary: Get choosable countries
      description: |
        Returns all countries available for selection.

        Country names are localized according to the requested
        ISO 639-1 language code.

        If no countries are found for the requested language, the endpoint
        still returns HTTP 200 with an empty data array.

      parameters:
        - name: lang
          in: query
          required: false
          description: ISO 639-1 language code. Defaults to English.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: en
            example: en

      responses:

        '200':
          description: Countries found, or no countries available for the requested language.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableCountriesResponseEnvelope200'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of available countries.
                        items:
                          $ref: '#/components/schemas/Country'
                    required:
                      - data

              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-countries
                status: 200
                timestamp: '2026-09-20T09:48:48Z'
                metadata:
                  country_count: 249
                  language: en
                  response_time_ms: 95
                data:
                  - country_code: AFG
                    country_name: Afghanistan
                  - country_code: ALB
                    country_name: Albania
                  - country_code: DZA
                    country_name: Algeria
                  - country_code: ASM
                    country_name: American Samoa
                  - country_code: AND
                    country_name: Andorra

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableCountriesResponseEnvelope500'
                  - type: object
                    properties:
                      data:
                        nullable: true

              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-countries
                status: 500
                timestamp: '2026-09-20T09:48:48Z'
                metadata:
                  language: en
                  response_time_ms: 95
                data: null
                message: Internal server error
    servers:
    - url: https://api.kulturbytes.de
    - url: https://localhost:9090

  /api/choosable-currencies:
    get:
      summary: Get choosable currencies
      description: Returns the available currencies localized in the requested language.
      operationId: getChoosableCurrencies

      parameters:
        - name: lang
          in: query
          required: false
          description: ISO 639-1 language code used for localized currency names.
          schema:
            type: string
            default: en
            minLength: 2
            maxLength: 2
            example: en

      responses:
        '200':
          description: Currencies successfully retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableCurrenciesResponseEnvelope200'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: Available currencies.
                        items:
                          $ref: '#/components/schemas/Currency'
                      metadata:
                        $ref: '#/components/schemas/ChoosableCurrenciesMetadata'
                    required:
                      - data
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-currencies
                status: 200
                timestamp: '2026-09-20T10:39:00Z'
                metadata:
                  language: en
                  response_time_ms: 12
                data:
                  - id: EUR
                    name: Euro
                  - id: GBP
                    name: Pound sterling
                  - id: USD
                    name: US Dollar

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableCurrenciesResponseEnvelope500'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-currencies
                status: 500
                timestamp: '2026-09-20T10:39:00Z'
                metadata:
                  language: en
                  response_time_ms: 8
                data: null
                message: Internal server error

  /api/choosable-event-occasions:
    get:
      summary: Get choosable event occasions
      description: Returns the available event occasion types localized in the requested language.
      operationId: getChoosableEventOccasions

      parameters:
        - name: lang
          in: query
          required: false
          description: ISO 639-1 language code used for localized event occasion names.
          schema:
            type: string
            default: en
            minLength: 2
            maxLength: 2
            example: en

      responses:
        '200':
          description: Event occasion types successfully retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableEventOccasionsResponseEnvelope200'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: Available event occasion types.
                        items:
                          $ref: '#/components/schemas/EventOccasionType'
                      metadata:
                        $ref: '#/components/schemas/ChoosableEventOccasionsMetadata'
                    required:
                      - data
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-event-occasions
                status: 200
                timestamp: '2026-09-20T11:37:00Z'
                metadata:
                  language: en
                  event_occasion_count: 5
                  response_time_ms: 12
                data:
                  - id: '0'
                    name: No specific occasion
                  - id: '1'
                    name: Anniversary
                  - id: '2'
                    name: Festival
                  - id: '3'
                    name: Opening
                  - id: '4'
                    name: Holiday

        '500':
          description: Internal server error while retrieving event occasion types.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableEventOccasionsResponseEnvelope500'
                  - type: object
                    properties:
                      data:
                        nullable: true
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-event-occasions
                status: 500
                timestamp: '2026-09-20T11:37:00Z'
                metadata:
                  language: en
                  response_time_ms: 8
                data: null
                message: Internal server error.

  /api/choosable-languages:
    get:
      operationId: getChoosableLanguages
      summary: Get choosable languages
      description: |
        Returns all languages that can be selected.

        Language names are localized according to the requested
        ISO 639-1 language code.

        If no languages are found for the requested language, the endpoint
        still returns HTTP 200 with an empty data array.

      parameters:
        - name: lang
          in: query
          required: false
          description: ISO 639-1 language code used to localize language names.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            default: en
            example: en

      responses:

        '200':
          description: Languages found, or no languages available for the requested language.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ChoosableLanguagesResponseEnvelope200'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of available languages.
                        items:
                          $ref: '#/components/schemas/Language'
                    required:
                      - data

              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-choosable-languages
                status: 200
                timestamp: '2026-09-20T10:17:15Z'
                metadata:
                  language: en
                  response_time_ms: 3
                data:
                  - id: da
                    name: Danish
                  - id: de
                    name: German
                  - id: en
                    name: English
                  - id: fr
                    name: French
                  - id: sv
                    name: Swedish

        '400':
          description: Invalid JSON input.
