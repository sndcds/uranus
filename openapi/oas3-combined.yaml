  /api/server/info:
    get:
      tags:
        - Server
      summary: Get server information
      description: |
        Returns the current server status, database status, and server uptime.

        The database connection is checked with a timeout of 3 seconds.
        If the database check fails, HTTP 503 Service Unavailable is returned.
      operationId: getServerInfo

      responses:
        '200':
          description: |
            HTTP 200 OK — the server is operational and the database
            connection check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfoResponse'
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-server-info
                status: 200
                timestamp: '2026-09-20T09:26:00+02:00'
                metadata:
                  response_time_ms: 12
                message: ''
                data:
                  status: ok
                  database: ok
                  uptime: 86400

        '503':
          description: |
            HTTP 503 Service Unavailable — the server is running,
            but the database connection check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfoResponse'
              example:
                service: Uranus API
                api_version: '1.0'
                response_type: get-server-info
                status: 503
                timestamp: '2026-09-20T09:26:00+02:00'
                metadata:
                  response_time_ms: 3010
                message: ''
                data:
                  status: error
                  database: error
                  uptime: 86400

        '500':
          description: |
            HTTP 500 Internal Server Error — server information
            could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfoResponseEnvelope'
    servers:
    - url: https://api.kulturbytes.de
      description: Production
    - url: https://localhost:9090

components:

  schemas:

    EventDetailsMetadata:
      type: object
      properties:
        response_time_ms:
          type: integer
          format: int64
          minimum: 0
      required:
        - response_time_ms
      additionalProperties: true
    EventDetailsResponseEnvelope:
      type: object
      properties:
        service:
          type: string
          example: Uranus API
        api_version:
          type: string
          example: '1.0'
        response_type:
          type: string
          enum:
            - get-event
            - get-event-by-date
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/EventDetailsMetadata'
        message:
          type: string
      required:
        - service
        - api_version
        - response_type
        - status
        - timestamp
        - metadata
    GetEventResponse200:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event
            status:
              type: integer
              enum:
                - 200
            data:
              $ref: '#/components/schemas/EventDetails'
          required:
            - data
    GetEventResponse500:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event
            status:
              type: integer
              enum:
                - 500
          required:
            - message
    GetEventByDateResponse200:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event-by-date
            status:
              type: integer
              enum:
                - 200
            data:
              $ref: '#/components/schemas/EventDetails'
            metadata:
              allOf:
                - $ref: '#/components/schemas/EventDetailsMetadata'
                - type: object
                  properties:
                    event_uuid:
                      type: string
                      format: uuid
                    date_identifier:
                      type: string
                    lang:
                      type: string
                      example: en
                    event_date_count:
                      type: integer
                      minimum: 1
                      description: Number of further dates plus one, including when no selected
                        date exists.
                  required:
                    - event_uuid
                    - date_identifier
                    - lang
                    - event_date_count
          required:
            - data
    GetEventByDateResponse400:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event-by-date
            status:
              type: integer
              enum:
                - 400
            metadata:
              allOf:
                - $ref: '#/components/schemas/EventDetailsMetadata'
                - type: object
                  properties:
                    event_uuid:
                      type: string
                      format: uuid
                    date_identifier:
                      type: string
                    lang:
                      type: string
                      example: en
                    event_date_count:
                      type: integer
                      minimum: 1
                      description: Number of further dates plus one, including when no selected
                        date exists.
          required:
            - message
    GetEventByDateResponse404:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event-by-date
            status:
              type: integer
              enum:
                - 404
            metadata:
              allOf:
                - $ref: '#/components/schemas/EventDetailsMetadata'
                - type: object
                  properties:
                    event_uuid:
                      type: string
                      format: uuid
                    date_identifier:
                      type: string
                    lang:
                      type: string
                      example: en
                    event_date_count:
                      type: integer
                      minimum: 1
                      description: Number of further dates plus one, including when no selected
                        date exists.
                  required:
                    - event_uuid
                    - date_identifier
                    - lang
          required:
            - message
    GetEventByDateResponse500:
      allOf:
        - $ref: '#/components/schemas/EventDetailsResponseEnvelope'
        - type: object
          properties:
            response_type:
              type: string
              enum:
                - get-event-by-date
            status:
              type: integer
              enum:
                - 500
            metadata:
              allOf:
                - $ref: '#/components/schemas/EventDetailsMetadata'
                - type: object
                  properties:
                    event_uuid:
                      type: string
                      format: uuid
