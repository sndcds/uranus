{{define "email_base"}}
<!DOCTYPE html>
<html lang="{{.Language}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            color: #374151;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .email-content {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 12px;
        }

        .heading {
            margin: 0 0 12px 0;
            font-size: 20px;
            color: #111827;
        }

        .text {
            margin: 0 0 18px 0;
            color: #374151;
            line-height: 1.5;
        }

        .button-container {
            margin: 0 0 20px 0;
        }

        .button {
            display: inline-block;
            background-color: #3f2dd2;
            color: #ffffff !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 500;
        }

        .muted {
            margin: 0 0 16px 0;
            color: #6b7280;
            font-size: 14px;
        }

        .link {
            color: #3f2dd2;
            text-decoration: none;
        }

        .footer {
            margin: 0;
            color: #374151;
        }

        .legal {
            margin: 20px 0 0 0;
            padding-top: 20px;
            border-top: 1px solid #eef2f6;
            font-size: 12px;
            color: #9ca3af;
        }

        .legal-link {
            color: #9ca3af;
            text-decoration: underline;
        }

        .copyright {
            margin: 12px 0 0 0;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        @media only screen and (max-width: 600px) {
            .email-container {
                padding: 24px 12px;
            }

            .email-content {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="email-content">

        {{template "content" .}}

        {{template "footer" .}}

    </div>

    <p class="copyright">
        © DatenSindDaten e. V.
    </p>
</div>
</body>
</html>
{{end}}
